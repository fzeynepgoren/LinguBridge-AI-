services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lingubridge-backend
    env_file:
      - ./backend/.env          # GEMINI_API_KEY burada
    environment:
      - ALLOW_ORIGINS=http://localhost:3000,http://localhost:80
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: lingubridge-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
